services:
  db:
    image: postgres:16
    container_name: tone-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, см. .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-tone_postgres}
    ports:
      - "${POSTGRES_PORT:-6543}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tone-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL не задан, см. .env.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD не задан, см. .env.example}
    ports:
      - "${PGADMIN_PORT:-8080}:80"

  mailpit:
    image: axllent/mailpit
    container_name: tone-mailpit
    restart: always
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

volumes:
  postgres_data:
