services:
  db:
    image: postgres:16
    container_name: tone-db
    restart: always
    environment:
      POSTGRES_USER: tone
      POSTGRES_PASSWORD: tone_secret_pwd
      POSTGRES_DB: tone_postgres
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tone-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"

  mailpit:
    image: axllent/mailpit
    container_name: tone-mailpit
    restart: always
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres_data:
